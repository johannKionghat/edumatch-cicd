# Compte de service dédié plutôt que `default` : "accès par rôles" (critère
# 2.7) commence par ne jamais laisser un pod utiliser le compte générique du
# namespace, même quand — comme ici — il n'a besoin d'appeler aucune API
# Kubernetes. `automountServiceAccountToken: false` retire jusqu'à
# l'existence même d'un jeton monté dans le pod : l'API FastAPI ne parle
# jamais à l'API Kubernetes, donc aucun jeton, même inutilisé, ne doit
# traîner dans le système de fichiers du conteneur — un jeton présent mais
# inutilisé reste une cible si le conteneur est compromis.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: edumatch-serve
  namespace: edumatch
automountServiceAccountToken: false
