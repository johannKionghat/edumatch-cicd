# Adaptation automatique du nombre de réplicas à la charge (critère
# 2.4/2.6) : c'est ce qui matérialise l'argument de saisonnalité du dossier,
# pas seulement une affirmation. Sans ce fichier, "il y a un rapport de 1 à 6
# entre le pic de janvier-mai et le creux estival" resterait une phrase de
# dossier sans preuve dans le dépôt.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: edumatch-serve
  namespace: edumatch
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: edumatch-serve

  # `minReplicas` et `maxReplicas` répondent à deux questions différentes,
  # et c'est volontaire de ne pas les faire coïncider avec un même rapport :
  #
  # - `maxReplicas: 6` matérialise la DEMANDE : le rapport de charge mesuré
  #   entre le pic de la période de vœux Parcoursup (janvier-mai) et le
  #   creux estival est de l'ordre de 1 à 6 (environ 30 % d'utilisation
  #   moyenne en dimensionnement fixe, voir docs/sous-docs-projets côté
  #   edumatch-ia). 6 est le nombre de réplicas nécessaires pour absorber le
  #   pic, sans dimensionner en permanence pour lui (ce que ferait un
  #   `replicas: 6` fixe, gaspillant environ 70 % de la capacité le reste de
  #   l'année) ; le pool de nœuds (terraform/variables.tf,
  #   `pool_taille_max: 2`) est dimensionné pour porter ces 6 pods.
  # - `minReplicas: 2` répond à une question de DISPONIBILITÉ, indépendante
  #   du niveau de charge : avec un seul réplica, un redémarrage de nœud ou
  #   la fenêtre entre la bascule d'un rolling update laisse un instant sans
  #   aucun pod prêt, quel que soit le trafic à ce moment-là — inacceptable
  #   même au creux estival, et même pour une démonstration qui doit rester
  #   joignable pendant qu'elle est filmée. Ce plancher ne découle PAS du
  #   rapport 1:6 : le confondre avec lui serait exactement l'erreur
  #   corrigée ici (voir deployment.yaml, qui déclarait un plancher de
  #   disponibilité à 2 en commentaire pendant que ce fichier imposait un
  #   plancher réel à 1, contradiction que le HPA aurait fait gagner à
  #   chaque tour de réconciliation).
  #
  # Le rapport 1:6 reste donc lisible dans l'amplitude utile de
  # l'autoscaling (2 à 6, un facteur 3 en fonctionnement normal), pas dans
  # les deux bornes brutes ; le nombre qui compte pour l'argument de
  # saisonnalité est le plafond de 6 au pic, pas le plancher.
  minReplicas: 2
  maxReplicas: 6

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # 60 %, pas les 80 % pris par habitude ailleurs : ce service sert
          # une route au budget de latence serré (SLO déclaré : p95 de
          # /matching sous 300 ms) depuis un catalogue déjà en mémoire —
          # l'essentiel du travail par requête est du calcul CPU, pas de
          # l'attente réseau ou disque. Attendre 80 % d'utilisation avant de
          # déclencher une extension laisserait trop peu de marge : entre la
          # décision de créer un pod et le moment où sa sonde `readiness`
          # le déclare prêt (démarrage + extraction des artefacts, voir
          # deployment.yaml), plusieurs dizaines de secondes s'écoulent
          # pendant lesquelles les pods déjà en service absorbent seuls la
          # charge montante. 60 % réserve cette marge. Seuil non mesuré sous
          # charge réelle (pas de cluster disponible ici) : à ajuster à la
          # baisse si la latence p95 se dégrade avant que le HPA ne réagisse
          # pendant une démonstration, à la hausse si les pods s'étendent
          # trop tôt pour un trafic qui n'en avait pas besoin.
          averageUtilization: 60

  behavior:
    scaleUp:
      # Réagit vite à une montée de charge : pas de fenêtre de stabilisation
      # qui retarderait la création de pods pendant un pic.
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      # Redescend prudemment : une fenêtre de 5 minutes évite un pod détruit
      # puis recréé quelques secondes plus tard sur un trafic qui fluctue
      # normalement (l'oscillation, un travers classique des HPA mal réglés).
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
