# Déploiement de l'API de matching (côté edumatch-ia), en réplicas
# identiques et interchangeables — aucun état local, voir le docstring de
# docker/Dockerfile.serve. L'image est référencée par le jeton
# __EDUMATCH_SERVE_IMAGE__, substitué par deploy.yml avant application (voir
# k8s/README.md) — jamais `latest` : la valeur substituée est toujours
# `<registre>/edumatch-serve:<empreinte-courte-du-commit>`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edumatch-serve
  namespace: edumatch
  labels:
    app: edumatch-serve
spec:
  # `replicas` n'est délibérément PAS fixé ici. Le HorizontalPodAutoscaler
  # (hpa.yaml) cible ce Deployment et impose son propre plancher
  # (`minReplicas: 2`) et son propre plafond (`maxReplicas: 6`) : dès qu'un
  # HPA pilote un Deployment, c'est lui qui décide du nombre de réplicas en
  # continu, `replicas` du Deployment n'étant qu'une valeur de départ que
  # Kubernetes utilise UNE seule fois, à la création de l'objet. La preuve
  # de la faute que fixer une valeur ici aurait produite : chaque
  # `kubectl apply` de ce fichier (à chaque `deploy.yml`) aurait réécrasé le
  # nombre de réplicas décidé par le HPA — par exemple redescendre à 2
  # pendant un pic à 5, avant que le HPA ne recorrige au tour de
  # réconciliation suivant — un aller-retour inutile et un signal
  # contradictoire pour quiconque lit `kubectl get events` pendant une
  # démonstration.
  # Conséquence assumée : à la toute première création de ce Deployment (pas
  # à chaque redéploiement, seulement la première fois), Kubernetes applique
  # son propre défaut de 1 réplica jusqu'à ce que le contrôleur HPA fasse son
  # premier tour de réconciliation (quelques secondes à une minute) et le
  # remonte à 2. C'est une fenêtre transitoire à la création initiale
  # uniquement, pas un état durable ni un risque de retomber à 1 après coup.
  revisionHistoryLimit: 3 # de quoi revenir en arrière de quelques versions sans accumuler indéfiniment d'anciens ReplicaSet
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0 # jamais moins de `replicas` pods prêts pendant une mise à jour
      maxSurge: 1 # un pod de plus le temps de la bascule, pas davantage sur un pool à 2 nœuds
  selector:
    matchLabels:
      app: edumatch-serve
  template:
    metadata:
      labels:
        app: edumatch-serve
    spec:
      # Anti-affinité SOUPLE (`preferred`, pas `required`) entre pods de ce
      # Deployment : demande au planificateur d'éviter de placer deux
      # réplicas sur le même nœud quand une alternative existe, sans jamais
      # bloquer un déploiement si elle ne peut pas être respectée. `required`
      # serait une faute ici : le pool de nœuds (terraform/variables.tf,
      # `pool_taille_min: 1`) peut redescendre à un seul nœud au creux de
      # charge, et une règle stricte empêcherait alors le second pod d'être
      # planifié du tout — un déploiement bloqué pour une raison de
      # résilience est pire que l'absence de résilience elle-même. Quand le
      # pool compte deux nœuds (charge normale ou pic), cette préférence
      # réduit le risque qu'une panne d'un seul nœud emporte les deux
      # réplicas à la fois ; voir aussi `pdb.yaml`, qui protège contre les
      # évictions volontaires (purge/maintenance planifiée) plutôt que contre
      # la perte réelle d'un nœud.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: edumatch-serve
      serviceAccountName: edumatch-serve
      automountServiceAccountToken: false

      # Aucune raison qu'un pod applicatif tire depuis un registre public :
      # le registre Scaleway (terraform/main.tf) est privé, donc un secret
      # `docker-registry` est nécessaire pour l'extraction elle-même — créé
      # à la main avant le premier déploiement (voir le README à la racine
      # du dépôt, jamais dans ce fichier versionné).
      imagePullSecrets:
        - name: edumatch-registry-pull

      # Contraintes de sécurité au niveau du pod : s'appliquent aux deux
      # conteneurs (init et principal) sauf override explicite plus bas.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001 # même uid que docker/Dockerfile.serve (edumatch-ia) : la cohérence entre l'image et le manifeste évite un `securityContext` qui contredirait ce que l'image a déjà choisi
        runAsGroup: 10001
        fsGroup: 10001 # les volumes emptyDir ci-dessous appartiennent à ce groupe, lisibles/écrivables par le conteneur sans étape `chown` supplémentaire
        seccompProfile:
          type: RuntimeDefault

      initContainers:
        # Récupère les deux artefacts précalculés (catalogue de prédictions,
        # précalcul SHAP — voir edumatch-ia/src/edumatch/api/state.py) depuis
        # le bucket Object Storage vers un volume partagé avec le conteneur
        # principal. Alternative écartée : entraîner au démarrage du pod —
        # `state.py` le permet déjà en repli, mais un entraînement complet
        # au démarrage de CHAQUE réplica (et à chaque redémarrage déclenché
        # par le HPA) est exactement la dette que ce mécanisme documente
        # comme non souhaitable en production.
        #
        # Tag vérifié le 22 septembre 2026, au premier déploiement des
        # manifestes : l'image existe sur Docker Hub, le conteneur démarre et
        # synchronise bien les artefacts depuis le stockage objet. Version
        # épinglée, jamais `latest` : une image d'initialisation qui changerait
        # sous les pieds du service ferait échouer le démarrage de tous les
        # réplicas à la fois, y compris ceux que le HPA ajoute sous charge.
        - name: recuperer-artefacts
          image: amazon/aws-cli:2.17.62
          command:
            - sh
            - -c
            - |
              set -eu
              aws --endpoint-url "$SCW_S3_ENDPOINT" s3 sync \
                "s3://$SCW_ARTEFACTS_BUCKET/matching" /app/data/processed/matching
              aws --endpoint-url "$SCW_S3_ENDPOINT" s3 sync \
                "s3://$SCW_ARTEFACTS_BUCKET/explicabilite" /app/data/processed/explicabilite
              # Référentiels IDÉO (3,0 Mio : formations.csv, metiers.csv, manifeste.json) :
              # corpus documentaire de l'assistant, construit au premier appel de /assistant.
              # Sans eux, cette route seule répond 503 ; le reste du service n'est pas concerné.
              aws --endpoint-url "$SCW_S3_ENDPOINT" s3 sync \
                "s3://$SCW_ARTEFACTS_BUCKET/referentiels" /app/data/external/referentiels
          envFrom:
            - configMapRef:
                name: edumatch-serve-config
          env:
            # Scaleway Object Storage accepte les mêmes clés API que le
            # reste de la console, présentées ici sous les noms attendus par
            # aws-cli (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY) — voir
            # k8s/secret.example.yaml pour la correspondance exacte.
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: edumatch-object-storage
                  key: access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: edumatch-object-storage
                  key: secret-access-key
          volumeMounts:
            - name: data
              mountPath: /app/data
          # Sans `requests`, l'ordonnanceur placerait ce conteneur sans
          # connaître son besoin réel et pourrait le co-localiser avec des
          # pods qui saturent déjà le nœud ; sans `limits`, une
          # synchronisation anormalement longue ou volumineuse pourrait
          # affamer le conteneur principal qui démarre en même temps sur le
          # même pod.
          #
          # La limite valait 128Mi, posée sur un transfert supposé de quelques
          # dizaines de mégaoctets. Éprouvée le 26 septembre 2026 sous une
          # montée en charge réelle, elle ne tenait pas : quand le HPA est
          # passé de deux à six réplicas, les quatre pods ajoutés ont
          # synchronisé les artefacts en même temps, et leur conteneur
          # d'initialisation a été tué pour dépassement mémoire
          # (`Init:OOMKilled`, code 137, cinq redémarrages, puis
          # `Init:CrashLoopBackOff`). Résultat : le HPA affichait six réplicas
          # et deux seulement servaient le trafic. La cause est le volume
          # transféré, dominé par le précalcul SHAP d'environ 114 Mo, que
          # `aws s3 sync` télécharge par morceaux concurrents.
          #
          # Le besoin exact n'est pas observable avec les outils en place : ni
          # `kubectl top pod --containers` ni l'API de statistiques du kubelet
          # ne rapportent un conteneur d'initialisation, qui a terminé avant
          # leur première collecte. Ce qui est mesuré, ce sont les bornes : à
          # 128Mi, quatre synchronisations simultanées échouent en OOMKilled ;
          # à 512Mi, les six réplicas atteignent tous `1/1 Running`. La limite
          # est donc fixée à 384Mi, au milieu de cet intervalle et au-dessus de
          # la taille des artefacts transférés, et la réservation à 128Mi, pour
          # que l'ordonnanceur compte ce transfert sans immobiliser un nœud qui
          # n'alloue que 2 274 Mi. Vérifié le 26 septembre 2026 sous la même
          # montée en charge : six réplicas prêts en 138 secondes, aucun
          # conteneur tué.
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

      containers:
        - name: edumatch-serve
          image: __EDUMATCH_SERVE_IMAGE__
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: edumatch-serve-config
          env:
            # Optionnelle : la brique RAG ne se charge qu'à la
            # première requête POST /assistant si cette variable est
            # renseignée (voir edumatch-ia, rag/generation.py) ; son absence
            # ne fait pas échouer l'API. `optional: true` évite un
            # `CreateContainerConfigError` si le secret n'a volontairement
            # pas été créé (démonstration qui n'active pas l'assistant).
            - name: MISTRAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: edumatch-mistral
                  key: api-key
                  optional: true
            # Comptes nominatifs de l'écran conseiller, au format
            # `identifiant:empreinte-scrypt` décrit dans .env.example côté
            # edumatch-ia (section « Ecran conseiller »). Pourquoi : chaque
            # inférence et chaque écartement doivent être imputables à une
            # personne identifiée (contrôle humain, article 14 du règlement
            # sur l'IA) — un compte partagé ne prouverait rien. Sans cette
            # variable, l'API refuse l'écran, /matching et /feedback (503).
            # Volontairement NON `optional` : un secret absent bloque le pod
            # en `CreateContainerConfigError`, visible dans
            # `kubectl get pods`, plutôt qu'une API qui démarre et refuse
            # ensuite chaque requête. Création : k8s/secret.example.yaml.
            - name: CONSEILLER_COMPTES
              valueFrom:
                secretKeyRef:
                  name: edumatch-conseillers
                  key: comptes

          # ─── requests / limits — le critère de cette étape ──────────────
          # Sans `requests`, l'ordonnanceur Kubernetes place le pod à
          # l'aveugle : il ne sait pas combien de mémoire ou de CPU réserver
          # sur le nœud choisi, et peut le co-localiser avec d'autres pods
          # jusqu'à saturer le nœud. Sans `limits`, ce conteneur pourrait
          # consommer toute la mémoire ou le CPU disponibles sur le nœud et
          # affamer ses voisins ; un dépassement de la limite mémoire (pas
          # de la limite CPU, qui ne fait que ralentir le conteneur) se
          # termine par un signal OOMKilled — le conteneur est tué, pas
          # simplement ralenti. `requests == limits` donnerait la classe de
          # qualité de service "Guaranteed" (jamais expulsé le premier sous
          # pression mémoire) ; ici les deux diffèrent volontairement, classe
          # "Burstable" : la charge d'une requête /matching individuelle est
          # légère (lecture d'un DataFrame déjà en mémoire, pas de calcul
          # SHAP à la volée — voir api/state.py), donc la moyenne réelle
          # devrait rester proche de `requests`, avec de la marge (`limits`)
          # pour un pic de requêtes concurrentes sans expulsion immédiate.
          #
          # Les valeurs mémoire viennent d'une mesure, plus d'une estimation,
          # et cette correction a une histoire. La réservation initiale de
          # 320Mi était un ordre de grandeur posé sur l'empreinte connue d'un
          # processus FastAPI, pandas, LightGBM et SHAP chargés en mémoire
          # (catalogue de 77 159 lignes, précalcul SHAP de 440 030 lignes),
          # faute de cluster pour mesurer. Le 22 septembre 2026,
          # `kubectl top pod` a donné la vraie empreinte, hors charge : 487 et
          # 510 Mio par réplica, soit une réservation sous-évaluée de moitié.
          #
          # La conséquence est arrivée le 26 septembre 2026. L'ordonnanceur
          # entassait les pods d'après une réservation de 320Mi, alors que
          # chacun consommait environ 500 Mio : le nœud est monté à 106 % de
          # sa mémoire, le kubelet a expulsé les pods en boucle, et environ
          # 90 pods sont morts en quatorze heures, dont un OOMKilled contre la
          # limite de 640Mi. Le message du kubelet nommait la cause sans
          # ambiguïté : « was using 514576Ki, request is 320Mi, has larger
          # consumption of memory ».
          #
          # D'où ces valeurs : 512Mi réservés, la mesure arrondie au multiple
          # supérieur, pour que l'ordonnanceur place les pods sur ce qu'ils
          # consomment vraiment ; 768Mi de plafond, marge au-dessus des
          # 510 Mio observés pour absorber l'index TF-IDF de l'assistant
          # documentaire (environ 26 Mio au pic de construction, chargé au
          # premier appel de /assistant) et un pic de requêtes concurrentes,
          # sans repasser par un OOMKilled à la moindre pointe.
          #
          # Le calcul de capacité, avec les valeurs réelles du pool. Un nœud
          # DEV1-M annonce 4 Go, mais n'alloue que 2 274 Mi aux pods (capacité
          # 3 398 Mi, moins les réservations du kubelet et du système) ; le
          # pool plafonne à deux nœuds (`terraform/variables.tf`,
          # `pool_taille_max`), soit 4 548 Mi allouables. Au plafond du HPA,
          # six réplicas réservent 6 × 512 = 3 072 Mi, la supervision 448 Mi
          # et les composants de `kube-system` 370 Mi : 3 890 Mi au total, donc
          # 658 Mi de marge, 86 % de l'allouable. Le conteneur
          # d'initialisation ne s'y ajoute pas, l'ordonnanceur retenant le
          # maximum entre ses 64Mi et les 512Mi du conteneur principal, pas
          # leur somme. Contrainte qui en découle : les six réplicas ne
          # tiennent qu'à trois par nœud, et le nœud qui porte aussi la
          # supervision arrive à 95 % de son allouable. Élargir le pool ou
          # abaisser le plafond du HPA sera nécessaire avant une charge réelle
          # soutenue ; c'est planifié avant mise en service, sous la
          # responsabilité du responsable sécurité technique.
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 768Mi

          # ─── Sondes — liveness et readiness ne répondent pas à la même
          # question (voir docstring de routes/health.py côté edumatch-ia).
          #
          # `startupProbe` couvre le temps de démarrage variable (extraction
          # de l'image, synchronisation des artefacts par le conteneur
          # d'initialisation, import des bibliothèques Python) sans que
          # liveness/readiness ne le comptent contre le pod : tant que le
          # démarrage n'a pas réussi une fois, les deux autres sondes sont
          # suspendues.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30 # jusqu'à 150s de démarrage tolérées avant d'être considéré bloqué

          # `liveness` répond à « le processus a-t-il planté ou est-il
          # bloqué ? » — elle interroge /health, une route volontairement
          # sans dépendance lourde (voir edumatch-ia). Seuils tolérants :
          # confondre liveness et readiness provoque des redémarrages en
          # boucle si les seuils sont trop stricts, exactement ce que le
          # docstring de health.py met en garde.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          # `readiness` répond à « ce pod doit-il recevoir du trafic
          # maintenant ? » — retire le pod du Service (pas un redémarrage)
          # le temps qu'il réponde de nouveau. Limite honnête, documentée
          # plutôt que masquée : /health ne vérifie PAS que l'état lourd
          # (catalogue de prédictions, précalcul SHAP — api/state.py) a bien
          # été construit ; `main.py` n'échoue jamais son démarrage sur cet
          # échec, il fait répondre 503 aux seules routes concernées
          # (/matching, /explain). Un pod peut donc être "prêt" au sens de
          # cette sonde sans que /matching réponde encore utilement. Corriger
          # cela demande une route de disponibilité dédiée côté edumatch-ia
          # (hors périmètre de ce dépôt, qui ne modifie jamais edumatch-ia) —
          # à proposer côté API dans une prochaine itération.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          volumeMounts:
            # Volume partagé avec le conteneur d'initialisation : contient
            # les artefacts précalculés ET les journaux d'audit/feedback que
            # l'API écrit elle-même en fonctionnement (api/audit.py,
            # api/feedback_store.py, côté edumatch-ia — append-only, sous
            # EDUMATCH_DATA_ROOT). C'est la seule exception assumée au
            # système de fichiers racine en lecture seule ci-dessous : sans
            # elle, /feedback et l'audit article 12 échoueraient à écrire.
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
