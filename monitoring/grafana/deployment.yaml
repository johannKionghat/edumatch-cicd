# Grafana : un seul réplica (aucune raison de le répliquer pour une
# démonstration — voir la même remarque sur Prometheus). Mot de passe
# administrateur JAMAIS en dur ici : lu depuis un Secret créé à la main,
# suivant exactement le même geste que `edumatch-object-storage` côté
# k8s/secret.example.yaml — voir README, section "Déployer", pour la
# commande exacte.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472 # utilisateur "grafana" de l'image officielle
        runAsGroup: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          # Tag non vérifié contre Docker Hub dans cette session — même
          # réserve que les autres images de ce dossier.
          image: grafana/grafana:11.2.0
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-password
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: datasource
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboard-edumatch
              mountPath: /var/lib/grafana/dashboards/edumatch
            - name: data
              mountPath: /var/lib/grafana
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: datasource
          configMap:
            name: grafana-datasource
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboard-edumatch
          # ConfigMap créé via `kubectl create configmap --from-file`, pas
          # défini dans ce dossier — voir README, section "Déployer".
          configMap:
            name: grafana-dashboard-edumatch
        - name: data
          emptyDir: {} # tableaux de bord provisionnés par fichier (ci-dessus) ; seule la base sqlite interne (préférences, sessions) est perdue au redémarrage — acceptable en démonstration
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
spec:
  type: ClusterIP
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
