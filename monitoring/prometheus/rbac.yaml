# RBAC minimal pour que Prometheus interroge l'API Kubernetes et découvre
# lui-même les pods edumatch-serve (kubernetes_sd_configs, role: endpoints
# dans configmap.yaml) plutôt qu'une liste d'adresses figée à la main, qui se
# périmerait à chaque redémarrage de pod ou passage du HPA.
#
# Lecture seule (`get`, `list`, `watch`), jamais d'écriture : Prometheus ne
# modifie jamais l'état du cluster, seulement il l'observe.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/metrics", "services", "endpoints", "pods", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring
