# Analyse de secrets (action AI-4 du plan de gouvernance), dépôt d'industrialisation. Les
# règles par défaut de gitleaks s'appliquent toutes : ce fichier n'en désactive aucune.
[extend]
useDefault = true

# `ci.yml` récupère les deux dépôts dans des sous-dossiers voisins et analyse chacun avec sa
# propre configuration. Cette exclusion est un filet : si l'analyse était un jour lancée depuis
# la racine de l'espace de travail, edumatch-ia serait parcouru avec CETTE configuration, et le
# faux positif daté de son historique remonterait comme une anomalie de ce dépôt-ci.
[[allowlists]]
description = "edumatch-ia, analysé séparément avec sa propre configuration"
paths = ['''(^|/)edumatch-ia/''']

# Note pour une analyse lancée à la main sur un poste : `gitleaks dir` parcourt aussi les
# fichiers exclus par `.gitignore`, donc `scaleway.env` (clés Scaleway réelles, jamais
# versionné) est remonté. C'est attendu et ce n'est pas exclu ici : un fichier de secrets
# présent sur le disque doit être signalé. En intégration continue, il n'existe pas, puisque
# seul le dépôt est récupéré. Pour ne contrôler que ce qui est versionné, utiliser
# `gitleaks git --log-opts=--all`, qui ne lit que l'historique.
